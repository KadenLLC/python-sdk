[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maildesk"
version = "0.1.0"
description = "Official Python SDK for the Maildesk API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{name = "Reginald Nriagu"}]
keywords = ["maildesk", "email", "api", "sdk", "contacts", "tags", "webhooks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-httpx>=0.30",
  "mypy>=1.10",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://maildesk.io"

[tool.hatch.build.targets.wheel]
packages = ["src/maildesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src/maildesk"]

[[tool.mypy.overrides]]
module = ["pytest_httpx.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# PEP 604 union syntax (X | Y, X | None) requires Python 3.10+ at runtime,
# which breaks Pydantic v2 model resolution on Python 3.9.
# `from __future__ import annotations` does not help because Pydantic evaluates
# annotation strings via get_type_hints() to build validators.
ignore = ["UP007", "UP045"]
