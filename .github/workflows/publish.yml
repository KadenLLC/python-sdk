name: Publish to PyPI

# Fires on tag push matching v*, e.g. v0.1.0 or v1.2.3.
# Release flow:
#   1. Bump "version" in pyproject.toml on main.
#   2. git tag v0.1.0 && git push --tags
#
# Uses PyPI Trusted Publishing (OIDC) — no API token needed. One-time setup:
#   1. Create/claim the `maildeskio` project on pypi.org (first release may need a
#      manual upload or project reservation).
#   2. PyPI → project → Publishing → Add trusted publisher:
#        - Owner: <your-github-org-or-user>
#        - Repository: python-sdk
#        - Workflow: publish.yml
#        - Environment: pypi
#   3. In the GitHub repo, create an environment named "pypi" (Settings →
#      Environments) — optionally add required reviewers for extra safety.

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c 'import tomllib,sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match pyproject.toml version $PKG_VERSION" >&2
            exit 1
          fi

      - run: pytest
      - run: mypy src/

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
